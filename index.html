<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="GlenCal">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>GlenCal</title>
<style>
/* Terminal style: black ground, amber accents, dense monospace rows in fixed columns (date | time | category | entry). Dark only. */
:root {
  --bg: #000000; --panel: #0e0e0e; --raise: #1a1a1a; --line: #262626;
  --fg: #ececec; --muted: #8c8c8c; --amber: #ffa21f; --on-amber: #000000;
  --cyan: #5fd0e8; --red: #ff5f56; --today: #1c1300;
  --headH: 7rem; --mbarH: 2rem;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { font-size: 13px; }
html, body { background: var(--bg); color: var(--fg); }
body { margin: 0; font-family: var(--mono); font-size: 1rem; line-height: 1.4; -webkit-text-size-adjust: 100%; font-variant-numeric: tabular-nums; overscroll-behavior-y: none; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
body.covered #app { visibility: hidden; }
button { font-family: inherit; }
input, textarea, select { font-family: var(--mono); }

/* header */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--panel); border-bottom: 1px solid var(--line); }
.bar .in { display: flex; flex-direction: column; gap: 0.45rem; padding-block: 0.5rem; padding-left: max(0.6rem, env(safe-area-inset-left, 0px)); padding-right: max(0.6rem, env(safe-area-inset-right, 0px)); }
.clocks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.3rem; }
.ck { display: flex; justify-content: space-between; align-items: baseline; gap: 0.3rem; min-width: 0; padding: 0.3rem 0.45rem; background: var(--bg); border: 1px solid var(--line); border-radius: 2px; }
.ck .c { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ck .h { font-size: 1.25rem; font-weight: 800; color: var(--muted); white-space: nowrap; }
.ck .o { font-size: 0.62rem; font-weight: 700; color: var(--muted); margin-left: 0.1rem; vertical-align: top; }
.ck.open { border-color: var(--amber); }
.ck.open .h, .ck.open .c { color: var(--amber); }
.ck.home { border-color: var(--cyan); }
.ck.home .h, .ck.home .c { color: var(--cyan); }
.ck.home.open { box-shadow: inset 3px 0 0 var(--amber); }
.chip.fin { border-color: var(--cyan); }
.chip.fin[aria-pressed="true"] { color: var(--cyan); background: var(--bg); border-color: var(--cyan); }
.chip.fin[aria-pressed="true"] .n { color: var(--cyan); }
.dgrp li.fin .t b { color: var(--cyan); font-weight: 700; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 0.25rem 0.8rem; font-size: 0.95rem; }
.kv span:nth-child(odd) { color: var(--muted); }
.r1 { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
.brand { font-weight: 800; color: var(--amber); letter-spacing: 0.08em; }
.clock { color: var(--muted); font-size: 0.8rem; margin-right: auto; white-space: nowrap; }
.key { font-weight: 700; font-size: 0.85rem; line-height: 1; letter-spacing: 0.04em; color: var(--amber); background: var(--raise); border: 1px solid var(--line); border-radius: 2px; padding: 0.45rem 0.55rem; cursor: pointer; white-space: nowrap; }
.key.go { color: var(--amber); background: var(--raise); border-color: var(--amber); }
.toast .key.go { color: var(--on-amber); background: var(--amber); }
.key:disabled { opacity: 0.45; }
.key:active { filter: brightness(1.3); }
.cmd { display: flex; align-items: center; gap: 0.4rem; background: var(--bg); border: 1px solid var(--line); border-radius: 2px; padding: 0 0.5rem; }
.cmd::before { content: ">"; color: var(--amber); font-weight: 800; }
.cmd:focus-within { border-color: var(--amber); }
.search { flex: 1; min-width: 0; font-size: 16px; padding: 0.35rem 0; border: 0; background: transparent; color: var(--fg); }
.search:focus { outline: none; }
.chips { display: flex; gap: 0.3rem; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; font-weight: 700; font-size: 0.8rem; line-height: 1; letter-spacing: 0.03em; text-transform: uppercase; color: var(--fg); background: var(--raise); border: 1px solid var(--line); border-radius: 2px; padding: 0.35rem 0.5rem; cursor: pointer; white-space: nowrap; }
.chip .n { color: var(--muted); margin-left: 0.3rem; font-weight: 500; }
.chip[aria-pressed="true"] { color: var(--amber); background: var(--bg); border-color: var(--amber); }
.chip[aria-pressed="true"] .n { color: var(--amber); opacity: 0.7; }
.notice { color: var(--amber); font-size: 0.8rem; }

/* feed */
main { padding-left: max(0.6rem, env(safe-area-inset-left, 0px)); padding-right: max(0.6rem, env(safe-area-inset-right, 0px)); padding-bottom: calc(4rem + env(safe-area-inset-bottom, 0px)); }
.mbar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--headH)); z-index: 3; display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; margin: 0.6rem 0 0; min-height: var(--mbarH); padding: 0 0.55rem; font-size: 0.85rem; font-weight: 800; letter-spacing: 0.14em; color: var(--amber); background: var(--raise); border-left: 2px solid var(--amber); border-bottom: 1px solid var(--line); cursor: pointer; box-shadow: 0 -0.6rem 0 var(--bg); }
.mbar .n { font-weight: 600; letter-spacing: 0.04em; font-size: 0.75rem; color: var(--muted); }
.mbar .n::after { content: "  JUMP ▾"; }
.mon:first-child .mbar { margin-top: 0; }
/* jump panel */
.jm { display: flex; flex-direction: column; gap: 0.4rem; }
.jmh { font-weight: 800; font-size: 0.85rem; letter-spacing: 0.14em; color: var(--amber); background: var(--raise); border-left: 3px solid var(--amber); padding: 0.35rem 0.55rem; }
.jd { display: grid; grid-template-columns: repeat(auto-fill, minmax(3.6rem, 1fr)); gap: 0.35rem; }
.jday { font-family: var(--mono); background: var(--raise); border: 1px solid var(--line); border-radius: 2px; color: var(--fg); padding: 0.4rem 0.2rem; display: flex; flex-direction: column; align-items: center; gap: 0.1rem; cursor: pointer; }
.jday b { font-size: 1.15rem; color: var(--amber); }
.jday .w { font-size: 0.7rem; color: var(--muted); }
.jday .e { font-family: var(--sans); font-size: 0.75rem; letter-spacing: -0.05em; min-height: 1em; }
.jday.past b { color: var(--muted); }
.jday.past .e { opacity: 0.55; }
.jday.today { border-color: var(--amber); background: var(--today); }
.dgrp { list-style: none; margin: 0; padding: 0; border-bottom: 1px solid var(--line); --card: var(--bg); }
.dgrp li { position: relative; overflow: hidden; }
.item { all: unset; box-sizing: border-box; position: relative; z-index: 1; display: grid; grid-template-columns: 3.6em 3.9em 1.5em minmax(0, 1fr) auto; column-gap: 0.35rem; align-items: baseline; width: 100%; padding: 0.28rem 0; cursor: pointer; background: var(--card); touch-action: pan-y; }
.item.anim { transition: transform 160ms ease; }
.item:focus-visible { outline: 1px solid var(--amber); outline-offset: -1px; }
.dc { font-weight: 800; color: var(--amber); white-space: nowrap; }
.dc .w { color: var(--muted); font-weight: 600; }
.tm { color: var(--cyan); white-space: nowrap; }
.emo { text-align: center; font-family: var(--sans); font-size: 0.9rem; }
.t { min-width: 0; overflow-wrap: anywhere; color: var(--fg); }
.pl { color: var(--muted); }
.cd { color: var(--muted); font-size: 0.8rem; font-weight: 700; text-align: right; white-space: nowrap; padding-left: 0.3rem; }
.dgrp li.hol .t { color: var(--muted); }
.due { display: inline-block; margin-left: 0.35rem; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.06em; color: var(--on-amber); background: var(--amber); padding: 0.05rem 0.3rem; border-radius: 2px; vertical-align: 0.08rem; }
.dgrp li.paid .t { color: var(--muted); text-decoration: line-through; }
.dgrp li.paid .due { background: var(--line); color: var(--muted); }
.rule { display: flex; justify-content: space-between; gap: 0.5rem; align-items: center; padding: 0.5rem 0.6rem; background: var(--bg); border: 1px solid var(--line); border-left: 2px solid var(--amber); cursor: pointer; text-align: left; width: 100%; color: var(--fg); font-family: var(--mono); font-size: 0.95rem; }
.rule .small { text-align: right; }
.f .two { display: grid; grid-template-columns: 1fr 1fr; gap: 0.45rem; }
.note { display: block; color: var(--muted); font-size: 0.9rem; }
.dgrp.past .t, .dgrp.past .dc, .dgrp.past .tm { color: var(--muted); }
.dgrp.past .emo { opacity: 0.55; }
.dgrp.today { --card: var(--today); box-shadow: inset 2px 0 0 var(--amber); }
.dgrp.today .dc::after { content: " ◀"; color: var(--amber); }
.swipe-del { position: absolute; inset: 0 0 0 auto; width: 5rem; display: flex; }
.swipe-del button { flex: 1; font-weight: 800; font-size: 0.85rem; letter-spacing: 0.06em; color: #fff; background: var(--red); border: 0; cursor: pointer; }
.nowline { display: flex; align-items: center; gap: 0.5rem; padding: 0.35rem 0; color: var(--amber); font-weight: 800; font-size: 0.85rem; letter-spacing: 0.04em; border-bottom: 1px solid var(--line); }
.nowline::after { content: ""; flex: 1; border-top: 1px dashed var(--amber); }
.empty { color: var(--muted); padding: 2rem 0.5rem; text-align: center; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); z-index: 25; display: flex; align-items: center; gap: 0.6rem; max-width: calc(100vw - 2rem); background: var(--raise); color: var(--fg); border: 1px solid var(--amber); border-radius: 2px; padding: 0.45rem 0.5rem 0.45rem 0.75rem; font-size: 0.9rem; }
.toast span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* sheets */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,0.7); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 42rem; max-height: 92vh; overflow-y: auto; background: var(--panel); border-top: 1px solid var(--amber); padding: 0.9rem max(0.8rem, env(safe-area-inset-right, 0px)) calc(0.9rem + env(safe-area-inset-bottom, 0px)) max(0.8rem, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 0.75rem; }
.sheet h2 { margin: 0; font-size: 1rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--amber); }
.sheet p, .lockbox p { margin: 0; color: var(--muted); font-family: var(--sans); font-size: 0.95rem; line-height: 1.45; }
textarea, .f input, .f select, .pw { display: block; font-size: 16px; width: 100%; min-width: 0; min-height: 2.4rem; border: 1px solid var(--line); border-radius: 2px; padding: 0.4rem 0.55rem; background: var(--bg); color: var(--fg); -webkit-appearance: none; appearance: none; }
.f input::-webkit-date-and-time-value { text-align: left; }
textarea:focus, .f input:focus, .f select:focus, .pw:focus { outline: none; border-color: var(--amber); }
textarea { min-height: 9rem; resize: vertical; }
.row { display: flex; flex-direction: column; gap: 0.5rem; padding: 0.6rem; background: var(--bg); border: 1px solid var(--line); border-left: 2px solid var(--amber); min-width: 0; }
.row.bad { border-left-color: var(--red); }
.f { display: flex; flex-direction: column; gap: 0.45rem; }
.f label { display: flex; flex-direction: column; gap: 0.15rem; font-size: 0.75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; min-width: 0; }
.rowtop { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; flex-wrap: wrap; font-size: 0.8rem; color: var(--muted); }
.src { font-size: 0.85rem; color: var(--muted); background: var(--panel); border: 1px dashed var(--line); padding: 0.4rem 0.5rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.flag { color: var(--amber); border: 1px solid var(--amber); padding: 0.35rem 0.45rem; font-size: 0.85rem; }
.actions { display: flex; gap: 0.5rem; justify-content: flex-end; flex-wrap: wrap; align-items: center; }
.actions .grow { margin-right: auto; }
.btn { font-weight: 800; font-size: 0.9rem; letter-spacing: 0.05em; text-transform: uppercase; border-radius: 2px; padding: 0.55rem 0.9rem; border: 1px solid var(--line); background: var(--raise); color: var(--fg); cursor: pointer; }
.btn.primary { background: var(--amber); color: var(--on-amber); border-color: var(--amber); }
.btn.danger { color: var(--red); border-color: var(--red); }
.btn:disabled { opacity: 0.45; }
.btn.link { border: 0; background: none; color: var(--muted); padding: 0.2rem 0.3rem; text-decoration: underline; text-transform: none; letter-spacing: 0; font-weight: 600; }
.err { color: var(--red); font-size: 0.9rem; font-weight: 700; }
.ok { color: var(--cyan); font-size: 0.9rem; }
.menu { display: flex; flex-direction: column; gap: 0.4rem; }
.menu .btn { text-align: left; }
.prog { height: 0.5rem; background: var(--bg); border: 1px solid var(--line); }
.prog > div { height: 100%; width: 0; background: var(--amber); transition: width 200ms; }
.small { font-size: 0.8rem; color: var(--muted); overflow-wrap: anywhere; }
.chat { display: flex; flex-direction: column; gap: 0.6rem; }
.chat .u { color: var(--amber); }
.chat .u::before { content: "> "; }
.chat .a { color: var(--fg); white-space: pre-wrap; }
.chg { border: 1px solid var(--amber); padding: 0.6rem; display: flex; flex-direction: column; gap: 0.35rem; }
.chg .add { color: var(--cyan); } .chg .upd { color: var(--amber); } .chg .del { color: var(--red); }

/* lock screen */
.lock { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: calc(env(safe-area-inset-top, 0px) + 1.5rem) max(1.2rem, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 1.5rem) max(1.2rem, env(safe-area-inset-left, 0px)); overflow-y: auto; }
.lockbox { width: 100%; max-width: 26rem; display: flex; flex-direction: column; gap: 0.9rem; }
.lockbox h1 { margin: 0; color: var(--amber); font-size: 1.6rem; letter-spacing: 0.2em; }
.lockbox .code { font-size: 1.25rem; font-weight: 800; letter-spacing: 0.08em; color: var(--fg); background: var(--panel); border: 1px solid var(--amber); padding: 0.7rem; text-align: center; user-select: all; -webkit-user-select: all; overflow-wrap: anywhere; }
.lockbox .btn { width: 100%; padding: 0.8rem; font-size: 1rem; }
.lockbox .btn.link { width: auto; align-self: center; padding: 0.3rem; font-size: 0.95rem; }
.lockbox label { display: flex; gap: 0.5rem; align-items: flex-start; font-family: var(--sans); color: var(--fg); font-size: 0.95rem; }
</style>
</head>
<body class="covered">
<div id="app">
  <header class="bar" id="bar"><div class="in">
    <div id="clocks" class="clocks" aria-label="World clocks"></div>
    <div class="r1">
      <span class="brand">GLENCAL</span>
      <span class="clock" id="clock"></span>
      <button id="ask" class="key" type="button">ASK</button>
      <button id="jump" class="key" type="button">TODAY</button>
      <button id="add" class="key go" type="button">+ ADD</button>
      <button id="more" class="key" type="button" aria-label="Menu">···</button>
    </div>
    <label class="cmd"><input id="q" class="search" type="search" placeholder="search" autocomplete="off" aria-label="Search"></label>
    <div id="chips" class="chips" aria-label="Categories"></div>
    <div id="notice" class="notice" hidden></div>
  </div></header>
  <main id="list"></main>
  <div id="toast" class="toast" role="status" hidden><span id="toastMsg"></span><button id="undo" class="key go" type="button">UNDO</button></div>
  <div id="scrim" class="scrim" hidden><div id="sheet" class="sheet" role="dialog" aria-modal="true"></div></div>
</div>
<div id="lock" class="lock"><div id="lockbox" class="lockbox"><h1>GLENCAL</h1></div></div>
<script src="parser.js"></script>
<script src="holidays.js"></script>
<script src="finance.js"></script>
<script src="vault.js"></script>
<script src="app.js"></script>
</body>
</html>
