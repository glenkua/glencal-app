<title>GlenCal</title>
<style>
/* Terminal style: black ground, amber accents, dense monospace rows in fixed columns (date | time | category | entry). Dark only. */
:root {
  --bg: #000000; --panel: #0e0e0e; --raise: #1a1a1a; --line: #262626;
  --fg: #ececec; --muted: #8c8c8c; --amber: #ffa21f; --on-amber: #000000;
  --cyan: #5fd0e8; --red: #ff5f56; --up: #4cd17a; --today: #1c1300;
  --headH: 7rem; --mbarH: 2rem;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { font-size: 13px; }
html, body { background: var(--bg); color: var(--fg); }
body { margin: 0; font-family: var(--mono); font-size: 1rem; line-height: 1.4; -webkit-text-size-adjust: 100%; font-variant-numeric: tabular-nums; overscroll-behavior-y: none; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: pan-x pan-y; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; }
.scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: none; -webkit-overflow-scrolling: touch; position: relative; }
#pw { position: relative; will-change: transform; }
.pull { position: absolute; left: 0; right: 0; top: -2.6rem; height: 2.6rem; display: flex; align-items: center; justify-content: center; gap: 0.4rem; color: var(--muted); font-size: 0.8rem; font-weight: 700; letter-spacing: 0.06em; }
.pull.ready { color: var(--amber); }
.pasthint { text-align: center; color: var(--muted); font-size: 0.72rem; letter-spacing: 0.06em; padding: 0.35rem 0 0.2rem; }
body.covered #app { visibility: hidden; }
button { font-family: inherit; }
input, textarea, select { font-family: var(--mono); }

/* header */
.bar { position: relative; flex: none; z-index: 6; padding-top: env(safe-area-inset-top, 0px); background: var(--panel); border-bottom: 1px solid var(--line); }
.bar .in { display: flex; flex-direction: column; gap: 0.45rem; padding-block: 0.5rem; padding-left: max(0.6rem, env(safe-area-inset-left, 0px)); padding-right: max(0.6rem, env(safe-area-inset-right, 0px)); }
.clocks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.3rem; }
.ck { display: flex; justify-content: space-between; align-items: baseline; gap: 0.3rem; min-width: 0; padding: 0.32rem 0.45rem; background: linear-gradient(180deg, #2a2a2a 0%, #151515 45%, #080808 100%); border: 1px solid #333; border-top-color: #4a4a4a; border-bottom-color: #111; border-radius: 5px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), inset 0 -2px 0 rgba(0,0,0,0.55), 0 2px 0 #000, 0 4px 8px rgba(0,0,0,0.75); }
.ck .h { text-shadow: 0 1px 0 #000; }
.ck .c { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ck .h { font-size: 1.25rem; font-weight: 800; color: var(--muted); white-space: nowrap; }
.ck .o { font-size: 0.62rem; font-weight: 700; color: var(--muted); margin-left: 0.1rem; vertical-align: top; }
.ck.open { border-color: var(--amber); }
.ck.open .h, .ck.open .c { color: var(--amber); }
.ck.home { border-color: #2b4f99; }
.ck.home .h, .ck.home .c { color: #9db8f2; }
.ck.home.open { box-shadow: inset 3px 0 0 var(--amber); }
.dgrp li.fin .t b { color: var(--cyan); font-weight: 700; }
/* central bank decisions: the most important ECON events */
.dgrp li.fin.cb .item { box-shadow: inset 2px 0 0 var(--amber); }
.dgrp li.fin.cb .t { font-weight: 800; color: var(--fg); padding-left: 0.15rem; }
.star { color: var(--amber); }
.sup { color: var(--up); font-weight: 700; }
.sdn { color: var(--red); font-weight: 700; }
.sin { color: var(--fg); font-weight: 700; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 0.25rem 0.8rem; font-size: 0.95rem; }
.kv span:nth-child(odd) { color: var(--muted); }
/* market ticker: slow continuous scroll; tap for the full table */
.tick { all: unset; box-sizing: border-box; display: block; width: 100%; overflow: hidden; white-space: nowrap; cursor: pointer; padding: 0.22rem 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); -webkit-mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent); mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent); }
.tk-track { display: inline-flex; animation: tk 55s linear infinite; will-change: transform; }
.tk-set { display: inline-flex; align-items: center; gap: 1.4rem; padding-right: 1.4rem; }
.tksep { color: var(--amber); font-size: 0.6rem; opacity: 0.8; padding: 0 0.3rem; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
.tick:active .tk-track { animation-play-state: paused; }
@keyframes tk { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { .tk-track { animation: none; } .tk-set + .tk-set { display: none; } .tick { overflow-x: auto; } }
.tq { font-size: 0.82rem; }
.tq b { color: var(--fg); font-weight: 700; margin-right: 0.35rem; }
.tq .v { color: var(--fg); }
.tq .up { color: var(--up); margin-left: 0.3rem; }
.tq .dn { color: var(--red); margin-left: 0.3rem; }
.tq .fl { color: var(--muted); margin-left: 0.3rem; }
.mt { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
.mt td { padding: 0.3rem 0.2rem; border-bottom: 1px solid var(--line); }
.mt td:nth-child(n+2) { text-align: right; }
.r1 { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
.brand { font-weight: 800; color: var(--amber); letter-spacing: 0.08em; }
.clock { color: var(--muted); font-size: 0.8rem; margin-right: auto; white-space: nowrap; }
.key { font-weight: 700; font-size: 0.85rem; line-height: 1; letter-spacing: 0.04em; color: var(--amber); background: var(--raise); border: 1px solid var(--line); border-radius: 2px; padding: 0.45rem 0.55rem; cursor: pointer; white-space: nowrap; }
.key.go { color: var(--amber); background: var(--raise); border-color: var(--amber); }
.toast .key.go { color: var(--on-amber); background: var(--amber); }
.key:disabled { opacity: 0.45; }
.key:active { filter: brightness(1.3); }
.cmd { display: flex; align-items: center; gap: 0.4rem; background: var(--bg); border: 1px solid var(--line); border-radius: 2px; padding: 0 0.5rem; }
.cmd::before { content: ">"; color: var(--amber); font-weight: 800; }
.cmd:focus-within { border-color: var(--amber); }
.search { flex: 1; min-width: 0; font-size: 16px; padding: 0.35rem 0; border: 0; background: transparent; color: var(--fg); }
.search:focus { outline: none; }
.chips { display: flex; gap: 0.3rem; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.chips::-webkit-scrollbar { display: none; }
.chip { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; flex: none; font-weight: 700; font-size: 0.8rem; line-height: 1; letter-spacing: 0.03em; text-transform: uppercase; color: var(--fg); background: var(--raise); border: 1px solid var(--line); border-radius: 2px; padding: 0.35rem 0.5rem; cursor: pointer; white-space: nowrap; }
.chip .n { color: var(--muted); margin-left: 0.3rem; font-weight: 500; }
.chip[aria-pressed="true"] { color: var(--amber); background: var(--bg); border-color: var(--amber); }
.chip[aria-pressed="true"] .n { color: var(--amber); opacity: 0.7; }
.chip.off { opacity: 0.45; text-decoration: line-through; }
.notice { color: var(--amber); font-size: 0.8rem; }

/* feed */
main { padding-left: max(0.6rem, env(safe-area-inset-left, 0px)); padding-right: max(0.6rem, env(safe-area-inset-right, 0px)); padding-bottom: 2rem; }
/* bottom section bar */
.tabs { position: relative; flex: none; z-index: 7; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--panel); border-top: 1px solid var(--line); padding: 0 max(0.6rem, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(0.6rem, env(safe-area-inset-left, 0px)); }
.tabs button { all: unset; text-align: center; padding: 0.6rem 0; font-weight: 800; font-size: 0.8rem; letter-spacing: 0.1em; color: var(--muted); cursor: pointer; border-top: 2px solid transparent; }
.tabs button[aria-pressed="true"] { color: var(--amber); border-top-color: var(--amber); }
/* news */
.nmeta { color: var(--muted); font-size: 0.8rem; padding: 0.45rem 0; }
.nrow { display: grid; grid-template-columns: 3.1em 3.6em minmax(0, 1fr); column-gap: 0.4rem; align-items: baseline; padding: 0.4rem 0; border-bottom: 1px solid var(--line); color: var(--fg); text-decoration: none; }
.nrow .nt { color: var(--cyan); }
.nrow .ns { color: var(--muted); font-weight: 700; font-size: 0.8rem; }
.nrow .nh { overflow-wrap: anywhere; }
.nrow .cc { color: var(--muted); font-size: 0.75rem; margin-left: 0.35rem; }
.nrow.cb .nh { font-weight: 800; }
.nrow.cb { box-shadow: inset 2px 0 0 var(--amber); padding-left: 0.3rem; }
.nrow.new .nt::after { content: " ●"; color: var(--amber); font-size: 0.6rem; vertical-align: 0.15rem; }
.nrow:visited .nh { color: var(--muted); }
/* morning brief */
.bhead { padding: 0.8rem 0 0.2rem; font-size: 1.05rem; font-weight: 800; letter-spacing: 0.1em; color: var(--fg); }
.bsec { margin-top: 0.9rem; }
.bnone { color: var(--muted); padding: 0.35rem 0; margin: 0; }
.bsub { color: var(--muted); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em; padding: 0.5rem 0 0.1rem; }
.brow { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 3.9em 1.5em minmax(0, 1fr) auto; column-gap: 0.35rem; align-items: baseline; width: 100%; padding: 0.3rem 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.brow .tm { color: var(--cyan); white-space: nowrap; }
.brow.cb .t { font-weight: 800; }
.brow.cb { box-shadow: inset 2px 0 0 var(--amber); padding-left: 0.3rem; }
.brow .cd { color: var(--muted); font-size: 0.75rem; }
.brow b.ccy { color: var(--cyan); font-weight: 700; }
.bgrid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 1rem; }
.bq { display: flex; justify-content: space-between; gap: 0.4rem; padding: 0.3rem 0; border-bottom: 1px solid var(--line); font-size: 0.92rem; min-width: 0; }
.bq b { font-weight: 700; color: var(--muted); white-space: nowrap; }
.bq .v { white-space: nowrap; }
/* notes */
.nwrap { position: relative; overflow: hidden; }
.nwrap .swipe-del { top: 1px; bottom: 1px; }
.nnote { position: relative; z-index: 1; background: var(--bg); touch-action: pan-y; }
.nnote { all: unset; box-sizing: border-box; position: relative; z-index: 1; background: var(--bg); touch-action: pan-y; display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 0.6rem; width: 100%; padding: 0.5rem 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.nnote .nt1 { font-weight: 700; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nnote .nd { color: var(--muted); font-size: 0.78rem; white-space: nowrap; }
.nnote .np { grid-column: 1 / -1; color: var(--muted); font-size: 0.88rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; }
.ned input { font-size: 18px !important; font-weight: 700; }
.ned textarea { min-height: 46vh; line-height: 1.45; }
.bfoot { color: var(--muted); font-size: 0.75rem; padding: 1rem 0 0.5rem; }
/* tools */
.toolsbox { padding-top: 0.6rem; display: flex; flex-direction: column; gap: 0.7rem; }
.cdisp { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 0.5rem 0.6rem; text-align: right; box-shadow: inset 0 2px 6px rgba(0,0,0,0.6); }
.cdisp { position: relative; }
.chist { max-height: 11rem; min-height: 4.5rem; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; text-align: left; border-bottom: 1px dashed var(--line); margin-bottom: 0.35rem; padding-right: 3.2rem; }
.chist .tl { all: unset; box-sizing: border-box; display: flex; justify-content: space-between; gap: 0.6rem; width: 100%; padding: 0.18rem 0; cursor: pointer; font-size: 0.95rem; }
.chist .tl:first-child { margin-top: auto; }
.chint { margin: auto 0 0.3rem; color: var(--muted); font-size: 0.8rem; }
.cclear { all: unset; position: absolute; top: 0.4rem; right: 0.5rem; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.08em; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0.15rem 0.35rem; cursor: pointer; }
.cexpr { color: var(--muted); min-height: 1.3em; overflow-wrap: anywhere; font-size: 1rem; }
.cres { all: unset; display: block; width: 100%; text-align: right; font-size: 2rem; font-weight: 800; color: var(--amber); overflow-wrap: anywhere; cursor: pointer; }
.ckeys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.35rem; margin-top: 0.5rem; }
.ck2 { font-family: var(--mono); font-size: 1.35rem; font-weight: 700; padding: 0.65rem 0; color: var(--fg); background: linear-gradient(180deg, #262626, #111); border: 1px solid #333; border-top-color: #444; border-radius: 6px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 2px 0 #000; cursor: pointer; touch-action: manipulation; }
.ck2.op { color: var(--amber); }
.ck2.fn { color: var(--cyan); font-size: 1rem; }
.ck2.eq { background: var(--amber); color: var(--on-amber); border-color: var(--amber); }
.ck2.del { color: var(--red); font-size: 1.55rem; border-color: rgba(255,95,86,0.55); }
.ck2:active { transform: translateY(1px); box-shadow: none; }
.tapehead { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 0.75rem; letter-spacing: 0.12em; margin-top: 0.6rem; }
.tape .tl { all: unset; box-sizing: border-box; display: flex; justify-content: space-between; gap: 0.6rem; width: 100%; padding: 0.35rem 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.te { color: var(--muted); overflow-wrap: anywhere; min-width: 0; }
.tr2 { color: var(--fg); white-space: nowrap; }
.solve { display: flex; gap: 0.4rem; } .solve input { flex: 1; min-width: 0; }
.th { margin: 0.6rem 0 0.1rem; font-size: 0.8rem; letter-spacing: 0.12em; color: var(--amber); }
.fxt td:nth-child(2) { font-weight: 700; }
.presets { display: flex; flex-wrap: wrap; gap: 0.3rem; }
/* fantasy */
.sp { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.04em; }
.sp.NBA { color: #f28c38; } .sp.NFL { color: #6fa8ff; }
.st { display: inline-block; font-size: 0.66rem; font-weight: 800; letter-spacing: 0.05em; padding: 0 0.25rem; border-radius: 2px; margin-right: 0.35rem; vertical-align: 0.08rem; border: 1px solid; }
.st.out { color: var(--red); } .st.doubt { color: var(--amber); } .st.in { color: var(--up); }
.fblurb { display: block; color: var(--muted); font-size: 0.85rem; margin-top: 0.1rem; }
.nrow.alert .nh { font-weight: 700; }
.trend h3 { margin: 0.8rem 0 0.3rem; font-size: 0.8rem; letter-spacing: 0.12em; color: var(--amber); }
.trend .tr { display: grid; grid-template-columns: 1.6em minmax(0, 1fr) auto; gap: 0.4rem; padding: 0.3rem 0; border-bottom: 1px solid var(--line); }
.trend .tr .k { color: var(--muted); } .trend .tr .a { color: var(--up); }
.mbar { position: sticky; top: 0; z-index: 3; display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; margin: 0.6rem 0 0; min-height: var(--mbarH); padding: 0 0.55rem; font-size: 0.85rem; font-weight: 800; letter-spacing: 0.14em; color: var(--amber); background: var(--raise); border-left: 2px solid var(--amber); border-bottom: 1px solid var(--line); cursor: pointer; box-shadow: 0 -0.6rem 0 var(--bg); }
.mbar .n { font-weight: 600; letter-spacing: 0.04em; font-size: 0.75rem; color: var(--muted); }
.mbar .n::after { content: "  JUMP ▾"; }
.mon:first-child .mbar { margin-top: 0; }
/* jump panel */
.jm { display: flex; flex-direction: column; gap: 0.4rem; }
.jmh { font-weight: 800; font-size: 0.85rem; letter-spacing: 0.14em; color: var(--amber); background: var(--raise); border-left: 3px solid var(--amber); padding: 0.35rem 0.55rem; }
.jd { display: grid; grid-template-columns: repeat(auto-fill, minmax(3.6rem, 1fr)); gap: 0.35rem; }
.jday { font-family: var(--mono); background: var(--raise); border: 1px solid var(--line); border-radius: 2px; color: var(--fg); padding: 0.4rem 0.2rem; display: flex; flex-direction: column; align-items: center; gap: 0.1rem; cursor: pointer; }
.jday b { font-size: 1.15rem; color: var(--amber); }
.jday .w { font-size: 0.7rem; color: var(--muted); }
.jday .e { font-family: var(--sans); font-size: 0.75rem; letter-spacing: -0.05em; min-height: 1em; }
.jday.past b { color: var(--muted); }
.jday.past .e { opacity: 0.55; }
.jday.today { border-color: var(--amber); background: var(--today); }
.dgrp { list-style: none; margin: 0; padding: 0; border-bottom: 1px solid var(--line); --card: var(--bg); }
.dgrp li { position: relative; overflow: hidden; }
.item { all: unset; box-sizing: border-box; position: relative; z-index: 1; display: grid; grid-template-columns: 3.6em 3.9em 1.5em minmax(0, 1fr) auto; column-gap: 0.35rem; align-items: baseline; width: 100%; padding: 0.28rem 0; cursor: pointer; background: var(--card); touch-action: pan-y; }
.item.anim { transition: transform 160ms ease; }
.item:focus-visible { outline: 1px solid var(--amber); outline-offset: -1px; }
.dc { font-weight: 800; color: var(--amber); white-space: nowrap; }
.dc .w { color: var(--muted); font-weight: 600; }
.tm { color: var(--cyan); white-space: nowrap; }
.emo { text-align: center; font-family: var(--sans); font-size: 0.9rem; }
.t { min-width: 0; overflow-wrap: anywhere; color: var(--fg); }
.pl { color: var(--muted); }
.cd { color: var(--muted); font-size: 0.8rem; font-weight: 700; text-align: right; white-space: nowrap; padding-left: 0.3rem; }
.dgrp li.hol .t { color: var(--muted); }
.due { display: inline-block; margin-left: 0.35rem; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.06em; color: var(--amber); border: 1px solid color-mix(in srgb, var(--amber) 60%, transparent); padding: 0 0.25rem; border-radius: 2px; vertical-align: 0.08rem; opacity: 0.85; }
.dgrp li.bill .t, .dgrp li.bill .tm { color: var(--muted); }
.dgrp li.bill .note { font-size: 0.8rem; opacity: 0.8; }
.dgrp li.bill .emo { opacity: 0.6; }
/* bills: a faintly lighter band so they read as separate from your own entries */
.dgrp li.bill .item { background: color-mix(in srgb, var(--card) 93%, #ffffff); }
.dgrp li.paid .t { color: var(--muted); text-decoration: line-through; }
.dgrp li.paid .due { border-color: var(--line); color: var(--muted); }
.rule { display: flex; justify-content: space-between; gap: 0.5rem; align-items: center; padding: 0.5rem 0.6rem; background: var(--bg); border: 1px solid var(--line); border-left: 2px solid var(--amber); cursor: pointer; text-align: left; width: 100%; color: var(--fg); font-family: var(--mono); font-size: 0.95rem; }
.rule .small { text-align: right; }
.arr { display: flex; align-items: center; gap: 0.4rem; padding: 0.35rem 0.5rem; background: var(--bg); border: 1px solid var(--line); }
.arr .lbl { flex: 1; min-width: 0; }
.arr .btn { padding: 0.35rem 0.6rem; }
.f .two { display: grid; grid-template-columns: 1fr 1fr; gap: 0.45rem; }
.note { display: block; color: var(--muted); font-size: 0.9rem; }
.dgrp.past .t, .dgrp.past .dc, .dgrp.past .tm { color: var(--muted); }
.dgrp.past .emo { opacity: 0.55; }
.dgrp.today { --card: var(--today); box-shadow: inset 2px 0 0 var(--amber); }
.dgrp.today .dc::after { content: " ◀"; color: var(--amber); }
.swipe-del { position: absolute; inset: 0 0 0 auto; width: 5rem; display: flex; }
